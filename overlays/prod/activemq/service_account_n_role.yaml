apiVersion: v1
kind: ServiceAccount
metadata:
  name: artemis-restarter
  namespace: activemq-artemis-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: artemis-restarter-role
  namespace: activemq-artemis-operator
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    # "patch" is required to update the template annotations for a rollout
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    # needed to wait for the broker pod to come back up before draining it
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # needed to run the artemis consumer drain command inside the broker pod
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: artemis-restarter-binding
  namespace: activemq-artemis-operator
subjects:
  - kind: ServiceAccount
    name: artemis-restarter
    namespace: activemq-artemis-operator
roleRef:
  kind: Role
  name: artemis-restarter-role
  apiGroup: rbac.authorization.k8s.io
