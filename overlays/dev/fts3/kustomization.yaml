namespace: fts3

resources:
  - ns.yaml
  - pvcs.yaml
  - deployment.yaml
  - fts3rest.yaml
  - fts3mon.yaml
  - fts3activemq.yaml
  - service.yaml
  - cronjobs.yaml
  - grid-certificates-job.yaml
  - cleaner-cronjob.yaml

secretGenerator:
  - name: fts3-configs
    options:
      disableNameSuffixHash: false
    files:
    - fts3config=etc/fts3config
    - fts3restconfig=etc/fts3restconfig
    - fts-activemq.conf=etc/fts-activemq.conf
  - name: fts3-host-pems
    options:
      disableNameSuffixHash: true
    files:
    - hostcert.pem=etc/secrets/hostcert.pem
    - hostkey.pem=etc/secrets/hostkey.pem
  - name: fts3-db
    options:
      disableNameSuffixHash: true
    files:
    - password=etc/secrets/fts3db-fts3-password
    - username=etc/secrets/fts3db-username
    - conn-str=etc/secrets/fts3db-connection-string-cluster
    - db-name=etc/secrets/fts3db-name
  - name: fts3-activemq-secrets
    options:
      disableNameSuffixHash: true
    envs:
      - etc/secrets/activemq-secrets
